name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist
            node_modules/.cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # Blocking gate. The shipped bundle is exactly the production tree, so anything
      # reachable by a user of the deployed app must fail the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Non-blocking. No dev-scope package reaches the bundle, so these are hygiene, not
      # incidents — they clear on the monthly Dependabot pass. Surfaced here so an alert
      # Dependabot silently skips is visible in CI instead of only in the alerts UI.
      - name: Audit full dependency tree
        continue-on-error: true
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
